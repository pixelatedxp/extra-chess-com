<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #fff;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #333;
    }
    .toggle-row:last-of-type {
      border-bottom: none;
    }
    label {
      font-size: 13px;
      cursor: pointer;
    }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .switch input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #444;
      border-radius: 22px;
      transition: 0.3s;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .slider {
      background: #4caf50;
    }
    input:checked + .slider::before {
      transform: translateX(18px);
    }
    .mode-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }
    .mode-section label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: #aaa;
    }
    .mode-section select,
    .mode-section input[type="number"] {
      padding: 6px 8px;
      background: #16213e;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }
    .mode-section select {
      width: 100%;
    }
    .elo-row-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .elo-row-controls input[type="number"] {
      flex: 1;
      min-width: 0;
    }
    .elo-row-controls button {
      padding: 6px 12px;
      background: #4caf50;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .elo-row-controls button:active {
      background: #3d8b40;
    }
    .blur-row {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }
    .blur-row label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: #aaa;
    }
    .blur-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .blur-controls input[type="range"] {
      flex: 1;
      accent-color: #4caf50;
    }
    .blur-controls span {
      font-size: 12px;
      color: #fff;
      min-width: 28px;
      text-align: right;
    }
  </style>
</head>
<body>
  <h2>♟ Extra Chess.com Focus Mode</h2>

  <div class="toggle-row">
    <label for="toggleRating">Rating</label>
    <div class="switch"><input type="checkbox" id="toggleRating" checked><span class="slider"></span></div>
  </div>
  <div class="toggle-row">
    <label for="toggleTitle">Title (GM, IM, etc)</label>
    <div class="switch"><input type="checkbox" id="toggleTitle" checked><span class="slider"></span></div>
  </div>
  <div class="toggle-row">
    <label for="togglePremium">Premium Badge</label>
    <div class="switch"><input type="checkbox" id="togglePremium" checked><span class="slider"></span></div>
  </div>
  <div class="toggle-row">
    <label for="toggleFlair">Flair</label>
    <div class="switch"><input type="checkbox" id="toggleFlair" checked><span class="slider"></span></div>
  </div>
  <div class="toggle-row">
    <label for="toggleFlag">Country Flag</label>
    <div class="switch"><input type="checkbox" id="toggleFlag" checked><span class="slider"></span></div>
  </div>
  <div class="toggle-row">
    <label for="toggleConnection">Connection Strength</label>
    <div class="switch"><input type="checkbox" id="toggleConnection" checked><span class="slider"></span></div>
  </div>
  <div class="toggle-row">
    <label for="togglePfp">Profile Picture</label>
    <div class="switch"><input type="checkbox" id="togglePfp" checked><span class="slider"></span></div>
  </div>
  <div class="toggle-row">
    <label for="toggleUsername">Username</label>
    <div class="switch"><input type="checkbox" id="toggleUsername"><span class="slider"></span></div>
  </div>
  <div class="toggle-row">
    <label for="toggleFakeTitle">Fake Title (you)</label>
    <div class="switch"><input type="checkbox" id="toggleFakeTitle"><span class="slider"></span></div>
  </div>

  <div class="mode-section" id="fakeTitleRow">
    <label for="fakeTitleValue">Title</label>
    <select id="fakeTitleValue">
      <option value="GM" selected>GM</option>
      <option value="IM">IM</option>
      <option value="NM">NM</option>
      <option value="FM">FM</option>
      <option value="CM">CM</option>
      <option value="WGM">WGM</option>
      <option value="WIM">WIM</option>
      <option value="WFM">WFM</option>
      <option value="WCM">WCM</option>
      <option value="WNM">WNM</option>
    </select>
  </div>

  <div class="toggle-row">
    <label for="toggleFakeElo">Fake ELO (you)</label>
    <div class="switch"><input type="checkbox" id="toggleFakeElo"><span class="slider"></span></div>
  </div>

  <div class="mode-section" id="fakeEloRow">
    <label for="fakeEloValue">ELO</label>
    <div class="elo-row-controls">
      <input type="number" id="fakeEloValue" min="0" max="4000" step="1" value="1500">
      <button type="button" id="fakeEloUpdate">Update</button>
    </div>
  </div>
  <div class="toggle-row">
    <label for="toggleFakePremium">Fake Premium Badge (you)</label>
    <div class="switch"><input type="checkbox" id="toggleFakePremium"><span class="slider"></span></div>
  </div>

  <div class="mode-section" id="fakeBadgeRow">
    <label for="fakeBadgeValue">Badge tier</label>
    <select id="fakeBadgeValue">
      <option value="diamond" selected>Diamond</option>
      <option value="platinum">Platinum</option>
      <option value="gold">Gold</option>
    </select>
  </div>
  <div class="toggle-row">
    <label for="toggleFakeFlair">Fake Membership Flair (you)</label>
    <div class="switch"><input type="checkbox" id="toggleFakeFlair"><span class="slider"></span></div>
  </div>

  <div class="mode-section">
    <label for="mode">Hide mode</label>
    <select id="mode">
      <option value="question">Replace with "?"</option>
      <option value="blur">Blur out</option>
      <option value="remove">Remove completely</option>
    </select>
  </div>

  <div class="mode-section blur-row" id="blurRow">
    <label for="blurStrength">Blur strength</label>
    <div class="blur-controls">
      <input type="range" id="blurStrength" min="0" max="100" step="1" value="50">
      <span id="blurStrengthValue">50</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

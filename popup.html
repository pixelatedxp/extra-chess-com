<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #fff;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #333;
    }
    .toggle-row:last-of-type {
      border-bottom: none;
    }
    label {
      font-size: 13px;
      cursor: pointer;
    }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .switch input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #444;
      border-radius: 22px;
      transition: 0.3s;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .slider {
      background: #4caf50;
    }
    input:checked + .slider::before {
      transform: translateX(18px);
    }
    .mode-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }
    .mode-section label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: #aaa;
    }
    select {
      width: 100%;
      padding: 6px 8px;
      background: #16213e;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h2>♟ Extra Chess.com Focus Mode</h2>

  <div class="toggle-row">
    <label for="toggleRating">Rating</label>
    <div class="switch"><input type="checkbox" id="toggleRating" checked><span class="slider"></span></div>
  </div>
  <div class="toggle-row">
    <label for="toggleTitle">Title (GM, IM, etc)</label>
    <div class="switch"><input type="checkbox" id="toggleTitle" checked><span class="slider"></span></div>
  </div>
  <div class="toggle-row">
    <label for="togglePremium">Premium Badge</label>
    <div class="switch"><input type="checkbox" id="togglePremium" checked><span class="slider"></span></div>
  </div>
  <div class="toggle-row">
    <label for="toggleFlair">Flair</label>
    <div class="switch"><input type="checkbox" id="toggleFlair" checked><span class="slider"></span></div>
  </div>
  <div class="toggle-row">
    <label for="toggleFlag">Country Flag</label>
    <div class="switch"><input type="checkbox" id="toggleFlag" checked><span class="slider"></span></div>
  </div>
  <div class="toggle-row">
    <label for="togglePfp">Profile Picture</label>
    <div class="switch"><input type="checkbox" id="togglePfp" checked><span class="slider"></span></div>
  </div>
  <div class="toggle-row">
    <label for="toggleUsername">Username</label>
    <div class="switch"><input type="checkbox" id="toggleUsername"><span class="slider"></span></div>
  </div>

  <div class="mode-section">
    <label for="mode">Hide mode</label>
    <select id="mode">
      <option value="question">Replace with "?"</option>
      <option value="blur">Blur out</option>
    </select>
  </div>

  <script src="popup.js"></script>
</body>
</html>
